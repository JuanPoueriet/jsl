<div class="toast-container" aria-live="polite" aria-atomic="false">
  @for (toast of toastService.toasts$ | async; track toast.id) {
    <div
      class="toast"
      [ngClass]="toast.type"
      [attr.role]="toast.type === 'error' ? 'alert' : 'status'"
    >
      <div class="toast-icon">
        @if (toast.type === 'success') {
          <lucide-icon [name]="icons.Check" [size]="20"></lucide-icon>
        } @else if (toast.type === 'error') {
          <lucide-icon [name]="icons.X" [size]="20"></lucide-icon>
        } @else {
          <lucide-icon [name]="icons.Info" [size]="20"></lucide-icon>
        }
      </div>
      <div class="toast-message">{{ toast.message | translate }}</div>
      <button class="toast-close" (click)="remove(toast.id)" aria-label="Close">
        <lucide-icon [name]="icons.X" [size]="16"></lucide-icon>
      </button>
      @if (toast.duration && toast.duration > 0) {
        <div class="toast-progress" [style.animation-duration.ms]="toast.duration"></div>
      }
    </div>
  }
</div>
